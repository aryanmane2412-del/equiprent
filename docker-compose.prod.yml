# EQUIPRENT production stack (single VM behind Caddy for automatic HTTPS).
#
#   cp .env.production.example .env.production   # fill EVERY value, never commit it
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy publishes ports (80/443). Postgres and Redis are on a private
# network. The API refuses to start if a secret is weak or a dev flag is on
# (see internal/config validation), so a bad .env.production fails loudly.
#
# Managed PostgreSQL is preferred for real traffic: delete the `postgres`
# service and point DATABASE_URL at it with sslmode=verify-full.

name: equiprent-prod

x-backend-env: &backend-env
  APP_ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: info
  HTTP_PORT: "8080"
  DATABASE_URL: postgres://equiprent:${POSTGRES_PASSWORD}@postgres:5432/equiprent?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  CORS_ALLOW_LOCALHOST: "false"
  HTTP_TRUSTED_PROXIES: 172.16.0.0/12   # docker bridge networks: Caddy's address
  API_PUBLIC_URL: https://${API_DOMAIN}
  APP_PUBLIC_URL: https://${APP_DOMAIN}
  API_DOCS_ENABLED: "false"
  JWT_SECRET: ${JWT_SECRET}
  OTP_SECRET: ${OTP_SECRET}
  STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  LOOKUP_HASH_KEY: ${LOOKUP_HASH_KEY}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /data/objects
  SMS_PROVIDER: ${SMS_PROVIDER}
  SMS_API_URL: ${SMS_API_URL}
  SMS_API_TOKEN: ${SMS_API_TOKEN}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER}
  EMAIL_API_URL: ${EMAIL_API_URL}
  EMAIL_API_TOKEN: ${EMAIL_API_TOKEN}
  EMAIL_FROM: ${EMAIL_FROM}
  PAYMENT_KEY_ID: ${PAYMENT_KEY_ID}
  PAYMENT_KEY_SECRET: ${PAYMENT_KEY_SECRET}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
  PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-}
  RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
  PAYOUT_MODE: ${PAYOUT_MODE:-IMPS}
  PAYOUT_MAX_PAISE: ${PAYOUT_MAX_PAISE:-20000000}
  PAYOUT_BANK_COOLDOWN: ${PAYOUT_BANK_COOLDOWN:-24h}

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: equiprent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: equiprent
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equiprent -d equiprent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://equiprent:${POSTGRES_PASSWORD}@postgres:5432/equiprent?sslmode=disable", "up"]
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      args: { TARGET: api }
    restart: unless-stopped
    environment: *backend-env
    volumes: [objects:/data/objects]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      args: { TARGET: worker }
    restart: unless-stopped
    environment:
      <<: *backend-env
      SERVICE_NAME: equiprent-worker
    volumes: [objects:/data/objects]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal, edge]   # needs outbound HTTPS for SMS, email, push

  web:
    build:
      context: ./frontend/equiprent_app
      dockerfile: ../../infrastructure/docker/frontend-web.Dockerfile
      args:
        API_BASE_URL: https://${API_DOMAIN}
        APP_ENV: production
    restart: unless-stopped
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [api, web]
    networks: [edge]

networks:
  internal:
    internal: true      # database and cache have no route to the internet
  edge: {}

volumes:
  pgdata:
  redisdata:
  objects:
  caddydata:

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: equiprent
          POSTGRES_PASSWORD: equiprent_dev_password
          POSTGRES_DB: equiprent_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U equiprent -d equiprent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://equiprent:equiprent_dev_password@localhost:5434/equiprent_test?sslmode=disable
      TEST_DATABASE_URL: postgres://equiprent:equiprent_dev_password@localhost:5434/equiprent_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Unit + integration tests (database-backed tests must RUN, not skip)
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout 20m -v ./... 2>&1 | tee test.log | grep -E '^(--- FAIL|FAIL|ok|panic)' || true
          if grep -q '^--- FAIL\|^FAIL\|^panic:' test.log; then
            echo 'tests failed'
            summary=$(grep -E -B1 -A12 '^(--- FAIL|panic:)' test.log | head -60 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Failing tests::${summary}"
            exit 1
          fi
          skipped=$(grep -c 'TEST_DATABASE_URL not set' test.log || true)
          if [ "$skipped" -gt 0 ]; then echo "::error::$skipped integration tests were skipped (TEST_DATABASE_URL missing)"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/equiprent_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Known-vulnerable Go dependencies
        working-directory: backend
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

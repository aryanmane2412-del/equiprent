version: "2"
sql:
  - engine: postgresql
    # sqlc reads the golang-migrate files and ignores *.down.sql.
    schema: migrations
    queries: sql/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          # Nullable scalars as plain Go pointers (nil = NULL) instead of pgtype.*.
          - { db_type: text, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: pg_catalog.bpchar, go_type: string }
          - { db_type: pg_catalog.bpchar, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: citext, go_type: string }
          - { db_type: citext, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: timestamptz, nullable: true, go_type: { import: time, type: Time, pointer: true } }
          - { db_type: date, go_type: time.Time }
          - { db_type: date, nullable: true, go_type: { import: time, type: Time, pointer: true } }
          - { db_type: pg_catalog.numeric, go_type: float64 }
          - { db_type: pg_catalog.numeric, nullable: true, go_type: { type: float64, pointer: true } }
          - { db_type: pg_catalog.int2, nullable: true, go_type: { type: int16, pointer: true } }
          - { db_type: pg_catalog.int4, nullable: true, go_type: { type: int32, pointer: true } }
          - { db_type: pg_catalog.int8, nullable: true, go_type: { type: int64, pointer: true } }
          - { db_type: pg_catalog.bool, nullable: true, go_type: { type: bool, pointer: true } }
          - { db_type: pg_catalog.float8, nullable: true, go_type: { type: float64, pointer: true } }
          - { db_type: float8, nullable: true, go_type: { type: float64, pointer: true } }
          - { db_type: pg_catalog.float4, nullable: true, go_type: { type: float32, pointer: true } }
          - { db_type: tsvector, go_type: string }
          - { db_type: tsvector, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: jsonb, go_type: encoding/json.RawMessage }
          - { db_type: jsonb, nullable: true, go_type: encoding/json.RawMessage }
          # PostGIS geography is never scanned raw: queries read/write points
          # as lat/lng floats (ST_MakePoint / ST_X / ST_Y). The model field holds
          # the EWKB hex text if a full row is ever selected.
          - db_type: geography
            go_type: string
          - db_type: geography
            nullable: true
            go_type:
              type: string
              pointer: true
